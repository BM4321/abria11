<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Notifications | ABRIA Operations</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="_ds/broadsheet-76d094bf-a515-4560-a98d-59aa4166844d/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<script src="_ds/broadsheet-76d094bf-a515-4560-a98d-59aa4166844d/_ds_bundle.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="abria-data.js"></script>
<script src="abria-mock.js"></script>
<style>:root{--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--font-heading:"Roboto",system-ui,sans-serif;--font-body:"Roboto",system-ui,sans-serif}body{margin:0;background:var(--app-page,#eae9e9);font-size:14px}a:not(.btn){color:var(--color-accent-700)}a:not(.btn):hover{color:var(--color-accent)}</style>
</helmet>
<dc-import name="Shell" active="notifications" hint-size="100%,0px"></dc-import>
<main style="padding:88px clamp(16px,3vw,32px) 56px calc(var(--shell-w,0px) + clamp(16px,3vw,32px));transition:padding-left .25s cubic-bezier(.4,0,.2,1);font-family:Roboto,system-ui,sans-serif">
<div style="max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px">
    <div style="margin-right:auto"><h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-0.01em">Notifications</h1><p style="margin:4px 0 0;font-size:15px;color:var(--app-muted)">{{ unreadText }}</p></div>
    <button type="button" class="btn btn-secondary" onClick="{{ markAll }}" disabled="{{ noneUnread }}" style="min-height:40px;border-radius:10px;background:var(--app-card)"><i class="ph ph-checks" aria-hidden="true"></i>Mark all as read</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6"><button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.on }}" style="min-height:36px;padding:0 14px;border-radius:999px;border:0;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;background:{{ c.bg }};color:{{ c.fg }};box-shadow:var(--shadow-sm)">{{ c.label }}</button></sc-for>
    <label style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" checked="{{ onlyUnread }}" onChange="{{ toggleUnread }}" style="width:16px;height:16px;accent-color:var(--color-accent)">Unread only</label>
  </div>
  <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
    <ul style="list-style:none;margin:0;padding:6px;border-radius:16px;background:var(--app-card);box-shadow:var(--shadow-sm);display:flex;flex-direction:column">
      <sc-for list="{{ items }}" as="n">
        <li style="display:flex;align-items:flex-start;gap:14px;padding:14px;border-radius:12px;background:{{ n.bg }}">
          <span style="width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:{{ n.ibg }};color:{{ n.ifg }}"><i class="{{ n.icon }}" aria-hidden="true" style="font-size:20px"></i></span>
          <a href="{{ n.href }}" onClick="{{ n.open }}" style="flex:1;min-width:0;text-decoration:none;color:var(--color-text)"><span style="display:block;font-size:14.5px;font-weight:{{ n.fw }}">{{ n.title }}</span><span style="display:block;margin-top:2px;font-size:13px;color:var(--app-muted)">{{ n.body }}</span><span style="display:block;margin-top:4px;font-size:12px;color:var(--app-muted)">{{ n.cat }} · {{ n.when }}</span></a>
          <button type="button" onClick="{{ n.toggle }}" aria-label="{{ n.toggleLabel }}" title="{{ n.toggleLabel }}" style="width:36px;height:36px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--app-muted);flex:none" style-hover="background:var(--app-hover)"><i class="{{ n.toggleIcon }}" aria-hidden="true" style="font-size:18px"></i></button>
        </li>
      </sc-for>
    </ul>
  </sc-if>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="padding:64px 24px;text-align:center;border-radius:16px;background:var(--app-card);box-shadow:var(--shadow-sm)"><span style="width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,oklch(0.62 0.13 155) 16%,transparent);color:oklch(0.5 0.13 155)"><i class="ph-duotone ph-check-circle" aria-hidden="true" style="font-size:32px"></i></span><p style="margin:16px 0 4px;font-size:18px;font-weight:600">You're all caught up.</p><p style="margin:0;font-size:14px;color:var(--app-muted)">New requests, shipment updates and carrier registrations will appear here.</p></div>
  </sc-if>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'All', unread: false, tick: 0 };
  componentDidMount() {
    const b = () => (window.ABRIA_M ? this.forceUpdate() : setTimeout(b, 30)); b();
    this._n = () => this.setState(s => ({ tick: s.tick + 1 })); window.addEventListener('abria-notes', this._n);
  }
  componentWillUnmount() { window.removeEventListener('abria-notes', this._n); }
  renderVals() {
    const M = window.ABRIA_M;
    if (!M) return { cats: [], items: [], hasItems: true };
    const all = M.DATA.notifications.slice().sort((a, b) => (a.at < b.at ? 1 : -1));
    const bump = () => window.dispatchEvent(new Event('abria-notes'));
    const cat = this.state.cat;
    const list = all.filter(n => (cat === 'All' || n.cat === cat) && (!this.state.unread || !n.read));
    const unread = all.filter(n => !n.read).length;
    const tone = { Requests: 'info', Shipments: 'warn', Carriers: 'ok', Quotes: 'info', System: 'muted' };
    return {
      unreadText: unread ? unread + ' unread' : 'No unread notifications',
      noneUnread: !unread, markAll: () => { all.forEach(n => (n.read = true)); bump(); M.toast('All notifications marked as read'); },
      cats: ['All', 'Requests', 'Shipments', 'Carriers', 'Quotes', 'System'].map(c => ({ label: c, on: cat === c, pick: () => this.setState({ cat: c }), bg: cat === c ? 'var(--color-accent)' : 'var(--app-card)', fg: cat === c ? 'var(--color-bg)' : 'var(--color-text)' })),
      onlyUnread: this.state.unread, toggleUnread: () => this.setState(s => ({ unread: !s.unread })),
      hasItems: list.length > 0, empty: list.length === 0,
      items: list.map(n => {
        const t = M.TONES[tone[n.cat]];
        return { title: n.title, body: n.body, cat: n.cat, when: M.rel(n.at), icon: 'ph-duotone ' + n.icon, href: M.hrefOf(n.href), fw: n.read ? 400 : 600,
          bg: n.read ? 'transparent' : 'color-mix(in srgb,var(--color-accent) 5%,transparent)', ibg: t.bg, ifg: t.fg,
          open: () => { n.read = true; }, toggle: () => { n.read = !n.read; bump(); },
          toggleLabel: n.read ? 'Mark as unread' : 'Mark as read', toggleIcon: n.read ? 'ph ph-envelope-simple' : 'ph ph-envelope-simple-open' };
      })
    };
  }
}
</script>
</body>
</html>
