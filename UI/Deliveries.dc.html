<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Deliveries | ABRIA Operations</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="_ds/broadsheet-76d094bf-a515-4560-a98d-59aa4166844d/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<script src="_ds/broadsheet-76d094bf-a515-4560-a98d-59aa4166844d/_ds_bundle.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="abria-data.js"></script>
<script src="abria-mock.js"></script>
<style>:root{--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--font-heading:"Roboto",system-ui,sans-serif;--font-body:"Roboto",system-ui,sans-serif}body{margin:0;background:var(--app-page,#eae9e9);font-size:14px}a:not(.btn){color:var(--color-accent-700)}a:not(.btn):hover{color:var(--color-accent)}</style>
</helmet>
<dc-import name="Shell" active="deliveries" hint-size="100%,0px"></dc-import>
<main style="padding:88px clamp(16px,3vw,32px) 56px calc(var(--shell-w,0px) + clamp(16px,3vw,32px));transition:padding-left .25s cubic-bezier(.4,0,.2,1);font-family:Roboto,system-ui,sans-serif">
<div style="max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:20px">
  <div><h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-0.01em">Deliveries</h1><p style="margin:4px 0 0;font-size:15px;color:var(--app-muted)">Upcoming and completed deliveries, with proof-of-delivery status.</p></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:16px">
    <sc-for list="{{ stats }}" as="k" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--app-card);box-shadow:var(--shadow-sm)"><span style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:{{ k.bg }};color:{{ k.fg }}"><i class="{{ k.icon }}" aria-hidden="true" style="font-size:22px"></i></span><div><div style="font-size:24px;font-weight:600">{{ k.v }}</div><div style="font-size:13px;color:var(--app-muted)">{{ k.k }}</div></div></div>
    </sc-for>
  </div>
  <dc-import name="DataTable" columns="{{ cols }}" rows="{{ rows }}" filters="{{ filters }}" search="Search by delivery, shipment, customer or destination" date-filter="{{ true }}" noun="deliveries" page-size="{{ 10 }}" simulate="{{ simulate }}" empty-title="No deliveries scheduled" empty-text="Deliveries appear here once shipments are booked." empty-icon="ph-seal-check" hint-size="100%,560px"></dc-import>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { const b = () => (window.ABRIA_M ? this.forceUpdate() : setTimeout(b, 30)); b(); }
  renderVals() {
    const M = window.ABRIA_M;
    if (!M) return { stats: [] };
    const D = M.DATA.deliveries, T = M.TONES, n = s => D.filter(x => x.status === s).length;
    return {
      stats: [{ k: 'Out for delivery', v: n('Out for Delivery'), icon: 'ph-duotone ph-truck', bg: T.warn.bg, fg: T.warn.fg }, { k: 'Scheduled', v: n('Scheduled'), icon: 'ph-duotone ph-calendar-check', bg: T.info.bg, fg: T.info.fg }, { k: 'Delayed', v: n('Delayed'), icon: 'ph-duotone ph-clock-countdown', bg: T.bad.bg, fg: T.bad.fg }, { k: 'Delivered this month', v: n('Delivered'), icon: 'ph-duotone ph-seal-check', bg: T.ok.bg, fg: T.ok.fg }],
      cols: M.COLS.deliveries, rows: M.ROWS.deliveries(D), simulate: M.param('state') || 'none',
      filters: [{ key: 'status', label: 'Status', options: ['Scheduled', 'Out for Delivery', 'Delayed', 'Delivered'] }, { key: 'carrier', label: 'Carrier', options: M.uniq(D, x => M.IDX.car[x.carrier].company) }]
    };
  }
}
</script>
</body>
</html>
