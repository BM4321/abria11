<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Trucks | ABRIA Operations</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="_ds/broadsheet-76d094bf-a515-4560-a98d-59aa4166844d/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<script src="_ds/broadsheet-76d094bf-a515-4560-a98d-59aa4166844d/_ds_bundle.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="abria-data.js"></script>
<script src="abria-mock.js"></script>
<style>:root{--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--font-heading:"Roboto",system-ui,sans-serif;--font-body:"Roboto",system-ui,sans-serif}body{margin:0;background:var(--app-page,#eae9e9);font-size:14px}a:not(.btn){color:var(--color-accent-700)}a:not(.btn):hover{color:var(--color-accent)}</style>
</helmet>
<dc-import name="Shell" active="trucks" hint-size="100%,0px"></dc-import>
<main style="padding:88px clamp(16px,3vw,32px) 56px calc(var(--shell-w,0px) + clamp(16px,3vw,32px));transition:padding-left .25s cubic-bezier(.4,0,.2,1);font-family:Roboto,system-ui,sans-serif">
<div style="max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:20px">
  <div><h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-0.01em">Trucks</h1><p style="margin:4px 0 0;font-size:15px;color:var(--app-muted)">Every registered vehicle, its owner and availability.</p></div>
  <div style="display:flex;flex-wrap:wrap;gap:10px">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5"><span style="display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;background:var(--app-card);box-shadow:var(--shadow-sm)"><span style="width:8px;height:8px;border-radius:50%;background:{{ c.dot }}"></span>{{ c.label }}<strong style="font-weight:600">{{ c.n }}</strong></span></sc-for>
  </div>
  <dc-import name="DataTable" columns="{{ cols }}" rows="{{ rows }}" filters="{{ filters }}" search="Search by registration, type, make or owner" noun="trucks" page-size="{{ 12 }}" simulate="{{ simulate }}" empty-title="No trucks registered" empty-text="Trucks registered by carriers will appear here." empty-icon="ph-steering-wheel" hint-size="100%,600px"></dc-import>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { const b = () => (window.ABRIA_M ? this.forceUpdate() : setTimeout(b, 30)); b(); }
  renderVals() {
    const M = window.ABRIA_M;
    if (!M) return { chips: [] };
    const D = M.DATA.trucks;
    return {
      chips: ['Available', 'Assigned', 'Pending', 'Maintenance', 'Inactive'].map(s => ({ label: s, n: D.filter(t => t.status === s).length, dot: M.badge(s).dot })),
      cols: M.COLS.trucks, rows: M.ROWS.trucks(D), simulate: M.param('state') || 'none',
      filters: [{ key: 'status', label: 'Status', options: ['Available', 'Assigned', 'Pending', 'Maintenance', 'Inactive'] }, { key: 'type', label: 'Type', options: M.uniq(D, 'type') }, { key: 'ver', label: 'Verification', options: ['Verified', 'Pending'] }, { key: 'region', label: 'Region', options: M.uniq(D, 'region') }]
    };
  }
}
</script>
</body>
</html>
